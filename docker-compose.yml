services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["4000:4000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/tenant_platform
      JWT_SECRET: development-secret-change-me
      PORT: 4000
    depends_on: [mongo]
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on: [api]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mongo-data:

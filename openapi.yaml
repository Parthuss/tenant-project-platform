openapi: 3.0.3
info: {title: Orbit Projects API, version: 1.0.0}
servers: [{url: http://localhost:4000/api}]
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters: {Tenant: {name: X-Tenant-Id, in: header, required: true, schema: {type: string}}}
paths:
  /auth/register:
    post: {summary: Register user and tenant, requestBody: {required: true}, responses: {'201': {description: Created}}}
  /auth/login:
    post: {summary: Sign in, responses: {'200': {description: JWT and memberships}}}
  /projects:
    get: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {description: Tenant projects}}}
    post: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'201': {description: Created}, '403': {description: Plan or role limit}}}
  /projects/{id}:
    get: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {description: Project}, '404': {description: Not found or inaccessible}}}
    patch: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {description: Updated}}}
    delete: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'204': {description: Deleted}}}
  /projects/{id}/tasks:
    post: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'201': {description: Created}, '403': {description: Limit reached}}}
  /invites:
    post: {security: [{bearerAuth: []}], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'201': {description: One-time invitation token}}}
  /invites/redeem:
    post: {summary: Redeem non-expired invitation, responses: {'201': {description: Membership created}, '400': {description: Invalid or expired invite}}}
